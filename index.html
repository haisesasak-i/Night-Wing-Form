<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NightWing</title>
    <link rel="stylesheet" href="./stylesheets/style.css">
    <link rel="stylesheet" href="./stylesheets/reset.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body class="flex">
    <div class="left flex">
        <p>Photo by <a href="https://www.pinterest.com/nightwingsavedmylife/" target="_blank"
                rel="noopener noreferrer">Edytka</a> On <a href="https://www.pinterest.com/pin/769623023864892795/"
                target="_blank" rel="noopener noreferrer">Pinterest</a></p>
        <div class="logo">
            <img src="./images/logo.png" alt="NightWing Logo black" width="100%">
            <p>Always look up.</p>
        </div>
    </div>
    <div class="right">
        <div class="header">
            <p>Every city has shadows, and every shadow needs someone
                watching from above. He used to work alone, but the
                rooftops are getting bigger, and so is the list of threats.</p>
            <p> Sign up to join the ones who move before trouble does.</p>
        </div>
        <form action="submit.php" method="post">
            <fieldset>
                <legend>Join the Watch</legend>
                <div class="form-row">
                    <div class="field">
                        <label for="fname">FIRST NAME</label>
                        <input type="text" id="fname" inputmode="text" name="first-name" placeholder="Bruce"
                            autocomplete="name" required>
                    </div>
                    <div class="field">
                        <label for="lname">LAST NAME</label>
                        <input type="text" id="lname" inputmode="text" name="last-name" placeholder="Wayne"
                            autocomplete="family-name" required>
                    </div>


                </div>
                <div class="form-row">
                    <div class="field">
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" inputmode="email" name="email"
                            placeholder="BruceWayne@example.com" autocomplete="email" required>
                    </div>
                    <div class="field">
                        <label for="turf">YOUR TURF</label>
                        <select id="turf" name="turf" required>
                            <option value="" disabled selected hidden>Select your city</option>
                            <option value="gotham">Gotham City</option>
                            <option value="bludhaven">Bludhaven</option>
                            <option value="metropolis">Metropolis</option>
                            <option value="star-city">Star City</option>
                            <option value="central-city">Central City</option>
                            <option value="other">Other (specify)</option>
                        </select>

                    </div>



                </div>
                <div class="form-row">
                    <div class="field">
                        <label for="pass">PASSWORD</label>
                        <input type="password" id="pass" inputmode="text" name="pass" placeholder="........."
                            pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$"
                            title="Min 8 characters, at least one uppercase letter, one lowercase letter, one number and one special character (@$!%*?&)"
                            autocomplete="new-password" required>
                    </div>
                    <div class="field">
                        <label for="confirm-pass">CONFIRM PASSWORD</label>
                        <input type="password" id="confirm-pass" inputmode="text" name="confirm-pass"
                            placeholder="........."
                            pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$"
                            title="Min 8 characters, at least one uppercase letter, one lowercase letter, one number and one special character (@$!%*?&)"
                            autocomplete="new-password" required>
                    </div>


                </div>

            </fieldset>


        </form>

    </div>
</body>


</html>
